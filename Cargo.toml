[workspace]
members = ["shared", "app", "vendor/nokhwa-bindings-windows"]
default-members = ["app", "shared"]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
telinha-shared = { path = "shared" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
nokhwa-bindings-windows = { path = "vendor/nokhwa-bindings-windows" }

