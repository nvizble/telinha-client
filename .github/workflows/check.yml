name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p telinha-shared -p nokhwa-bindings-windows

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/bundle_macos.py
      - run: cargo test --locked -p telinha
      - run: dist/telinha.app/Contents/MacOS/telinha --check-fonts
      - run: dist/telinha.app/Contents/MacOS/telinha --camera-probe

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: cargo test --locked --release --target x86_64-pc-windows-msvc -p telinha -p telinha-shared -p nokhwa-bindings-windows
